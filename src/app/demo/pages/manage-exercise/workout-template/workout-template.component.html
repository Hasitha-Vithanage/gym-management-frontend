<div class="container">
  <div class="table-section">
    <!-- Title -->
    <h2 class="form-title">
      <img src="../../../../assets/images/icon/template-light.png"
        style="margin-right: 5px; height: 18px; width: 18px" />
      Workout Templates
    </h2>

    <div class="toolbar">
      <!-- Add New -->
      <div class="add-new">
        <button type="reset" mat-raised-button class="new-button half-width" (click)="openWorkoutTemplateDialog()">
          <img src="../../../../assets/images/icon/add-light-icon.png"
            style="margin-right: 5px; height: 18px; width: 18px" />
          Add New Template
        </button>
      </div>

      <!-- Filter -->
      <div class="table-filter">
        <div class="search-bar">
          <img src="../../../../assets/images/icon/search.png"
            style="margin-right: 5px; height: 18px; width: 18px" />
          <input type="text" placeholder="Search..." (keyup)="applyFilter($event)" />
        </div>
        <button mat-icon-button class="refresh-button" (click)="refreshData()">
          <img src="../../../../assets/images/icon/refresh.png"
            style="margin-right: 5px; height: 18px; width: 18px" />
        </button>
      </div>
    </div>

    <div class="table-wrapper">
      <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

        <!-- Template Name -->
        <ng-container matColumnDef="templateName">
          <th mat-header-cell *matHeaderCellDef>Template Name</th>
          <td mat-cell *matCellDef="let t">{{ t.templateName }}</td>
        </ng-container>

        <!-- Goal -->
        <ng-container matColumnDef="goal">
          <th mat-header-cell *matHeaderCellDef>Goal</th>
          <td mat-cell *matCellDef="let t">{{ t.goal }}</td>
        </ng-container>

        <!-- Difficulty -->
        <ng-container matColumnDef="difficultyLevel">
          <th mat-header-cell *matHeaderCellDef>Difficulty</th>
          <td mat-cell *matCellDef="let t">{{ t.difficultyLevel }}</td>
        </ng-container>

        <!-- Duration -->
        <ng-container matColumnDef="durationMinutes">
          <th mat-header-cell *matHeaderCellDef>Duration</th>
          <td mat-cell *matCellDef="let t">{{ t.durationMinutes }} min</td>
        </ng-container>

        <!-- Days Per Week -->
        <ng-container matColumnDef="daysPerWeek">
          <th mat-header-cell *matHeaderCellDef>Days/Week</th>
          <td mat-cell *matCellDef="let t">{{ t.daysPerWeek }}</td>
        </ng-container>

        <!-- Location -->
        <ng-container matColumnDef="location">
          <th mat-header-cell *matHeaderCellDef>Location</th>
          <td mat-cell *matCellDef="let t">{{ t.location }}</td>
        </ng-container>

        <!-- Suitable For -->
        <ng-container matColumnDef="suitableFor">
          <th mat-header-cell *matHeaderCellDef>Suitable For</th>
          <td mat-cell *matCellDef="let t">{{ t.suitableFor }}</td>
        </ng-container>

        <!-- Status -->
        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Status</th>
          <td mat-cell *matCellDef="let t">
            <span [ngClass]="{
              'badge-active':   t.status === 'Active',
              'badge-inactive': t.status === 'Inactive',
              'badge-draft':    t.status === 'Draft'
            }">
              {{ t.status }}
            </span>
          </td>
        </ng-container>

        <!-- Actions -->
        <ng-container matColumnDef="actions">
          <th style="text-align: center;" mat-header-cell *matHeaderCellDef>Actions</th>
          <td style="display: flex; justify-content: center;" mat-cell *matCellDef="let t">
            <div class="action-column">
              <button mat-icon-button class="" matTooltip="Assign Exercises" (click)="assignExercises(t)">
                <img src="../../../../assets/images/icon/assign-light.png"
                  style="margin-right: 5px; height: 18px; width: 18px">
              </button>
              <button mat-icon-button class="gray-icon-btn" matTooltip="Edit" (click)="editData(t)">
                <img src="../../../../assets/images/icon/edit-light.png"
                  style="margin-right: 5px; height: 18px; width: 18px">
              </button>
              <button mat-icon-button class="gray-icon-btn" matTooltip="Delete" (click)="deleteData(t)">
                <img src="../../../../assets/images/icon/delete-light.png"
                  style="margin-right: 5px; height: 18px; width: 18px">
              </button>
            </div>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

        <!-- No data row -->
        <tr *ngIf="dataSource?.data?.length === 0">
          <td [attr.colspan]="displayedColumns.length" class="no-data">
            No records found
          </td>
        </tr>

      </table>
    </div>

    <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of templates"
      class="pagination">
    </mat-paginator>

  </div>
</div>
