<div class="form-container">

  <!-- Header -->
  <div class="form-header">
    <h2>Add New Exercise</h2>
    <button class="close-btn" (click)="closeDialog()">
      <img src="../../../../assets/images/icon/close-light.png" style="margin-right: 5px;">
    </button>
  </div>

  <form [formGroup]="exerciseForm" (ngSubmit)="onSubmit()" class="form-body">

    <!-- 🔹 BASIC INFO -->
    <h3 class="section-title">Basic Info</h3>
    <hr class="divider"/>

    <div class="grid">
      <div class="field full">
        <label>Exercise Name<span class="required">*</span></label>
        <input type="text" placeholder="Enter exercise name" formControlName="exerciseName" />
      </div>

      <div class="field full">
        <label>Description</label>
        <textarea placeholder="Enter exercise description" formControlName="description"></textarea>
      </div>

      <div class="field full">
        <label>Instructions</label>
        <textarea placeholder="Enter exercise instructions" formControlName="instructions"></textarea>
      </div>
    </div>
    <hr>
    <!-- 🔹 CLASSIFICATION -->
    <h3 class="section-title">Classification</h3>
    <hr class="divider"/>

    <div class="grid">
      <div class="field">
        <label>Primary Muscle<span class="required">*</span></label>
        <select formControlName="muscleGroup">
          <option value="">Select</option>
          <option>Chest</option>
          <option>Back</option>
          <option>Legs</option>
          <option>Shoulders</option>
          <option>Arms</option>
          <option>Core</option>
        </select>
      </div>

      <div class="field">
        <label>Secondary Muscle</label>
        <select formControlName="muscleGroupSecondary">
          <option value="">Select</option>
          <option>Chest</option>
          <option>Back</option>
          <option>Legs</option>
          <option>Shoulders</option>
          <option>Arms</option>
          <option>Core</option>
        </select>
      </div>

      <div class="field">
        <label>Exercise Type<span class="required">*</span></label>
        <select formControlName="exerciseType">
          <option value="">Select</option>
          <option>Strength</option>
          <option>Cardio</option>
          <option>Mobility</option>
          <option>Flexibility</option>
        </select>
      </div>

      <div class="field">
        <label>Movement<span class="required">*</span></label>
        <select formControlName="movementType">
          <option value="">Select</option>
          <option>Push</option>
          <option>Pull</option>
          <option>Squat</option>
          <option>Hinge</option>
          <option>Isolation</option>
        </select>
      </div>
    </div>
    <hr>
    <!-- 🔹 DIFFICULTY -->
    <h3 class="section-title">Difficulty & Setup</h3>
    <hr class="divider"/>

    <div class="grid">
      <div class="field">
        <label>Difficulty<span class="required">*</span></label>
        <select formControlName="difficultyLevel">
          <option value="">Select</option>
          <option>Beginner</option>
          <option>Intermediate</option>
          <option>Advanced</option>
        </select>
      </div>

      <div class="field">
        <label>Intensity<span class="required">*</span></label>
        <select formControlName="intensityLevel">
          <option value="">Select</option>
          <option>Low</option>
          <option>Medium</option>
          <option>High</option>
        </select>
      </div>

      <div class="field">
        <label>Equipment<span class="required">*</span></label>
        <select formControlName="equipmentType">
          <option value="">Select</option>
          <option>Bodyweight</option>
          <option>Dumbbell</option>
          <option>Barbell</option>
          <option>Machine</option>
          <option>Resistance Band</option>
        </select>
      </div>

      <div class="field">
        <label>Location<span class="required">*</span></label>
        <select formControlName="location">
          <option value="">Select</option>
          <option>Home</option>
          <option>Gym</option>
        </select>
      </div>
    </div>
    <hr>
    <!-- 🔹 TARGET -->
    <h3 class="section-title">Targeting</h3>
    <hr class="divider"/>

    <div class="grid">
      <div class="field">
        <label>Goal<span class="required">*</span></label>
        <select formControlName="goalType">
          <option value="">Select</option>
          <option>Fat Loss</option>
          <option>Muscle Gain</option>
          <option>Strength</option>
          <option>Endurance</option>
        </select>
      </div>

      <div class="field">
        <label>Suitable For<span class="required">*</span></label>
        <select formControlName="suitableFor">
          <option value="">Select</option>
          <option>All</option>
          <option>Male</option>
          <option>Female</option>
        </select>
      </div>
    </div>

    <!-- Actions -->
    <div class="action-buttons">
      <button type="submit" class="register-button field">Save</button>
      <button type="button" class="reset-button field" (click)="resetData()">Reset</button>
    </div>

  </form>
</div>
