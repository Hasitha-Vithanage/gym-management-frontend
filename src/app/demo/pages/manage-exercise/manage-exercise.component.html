<div class="container">
  <!-- Table Section to the Right of Form -->
  <div class="table-section">
    <!-- title of the-->
    <h2 class="form-title">
      <img src="../../../../assets/images/icon/exercise-dark.png" style="margin-right: 5px" />
      Manage Exercises
    </h2>

    <div class="toolbar">
      <!-- add-new on the left -->
      <div class="add-new">
        <button type="reset" mat-raised-button class="new-button half-width" (click)="openExerciseDialog()">
          <img src="../../../../assets/images/icon/add-light-icon.png" style="margin-right: 5px; height: 18px; width: 18px" />
          Add New Exercise
        </button>
      </div>

      <!-- table filter-->
      <div class="table-filter">
        <!-- Search bar -->
        <div class="search-bar">
          <img src="../../../../assets/images/icon/search-icon.png" style="margin-right: 5px; height: 18px; width: 18px" />
          <input type="text" placeholder="Search..." (keyup)="applyFilter($event)" />
        </div>

        <!-- refresh button-->
        <button mat-icon-button class="refresh-button" (click)="refreshData()">
          <img src="../../../../assets/images/icon/refresh-icon.png" style="margin-right: 5px; height: 18px; width: 18px" />
        </button>
      </div>
    </div>

    <div class="table-wrapper">
      <table mat-table [dataSource]="dataSource">
        <!-- Exercise Name -->
        <ng-container matColumnDef="exerciseName">
          <th mat-header-cell *matHeaderCellDef>Exercise</th>
          <td mat-cell *matCellDef="let e">{{ e.exerciseName }}</td>
        </ng-container>

        <!-- Muscle -->
        <ng-container matColumnDef="muscleGroup">
          <th mat-header-cell *matHeaderCellDef>Primary Muscle</th>
          <td mat-cell *matCellDef="let e">{{ e.muscleGroup }}</td>
        </ng-container>

        <!-- Secondary -->
        <ng-container matColumnDef="muscleGroupSecondary">
          <th mat-header-cell *matHeaderCellDef>Secondary</th>
          <td mat-cell *matCellDef="let e">{{ e.muscleGroupSecondary }}</td>
        </ng-container>

        <!-- Type -->
        <ng-container matColumnDef="exerciseType">
          <th mat-header-cell *matHeaderCellDef>Type</th>
          <td mat-cell *matCellDef="let e">{{ e.exerciseType }}</td>
        </ng-container>

        <!-- Movement -->
        <ng-container matColumnDef="movementType">
          <th mat-header-cell *matHeaderCellDef>Movement</th>
          <td mat-cell *matCellDef="let e">{{ e.movementType }}</td>
        </ng-container>

        <!-- Difficulty -->
        <ng-container matColumnDef="difficultyLevel">
          <th mat-header-cell *matHeaderCellDef>Difficulty</th>
          <td mat-cell *matCellDef="let e">{{ e.difficultyLevel }}</td>
        </ng-container>

        <!-- Actions -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let e">
            <button (click)="editData(e)">Edit</button>
            <button (click)="deleteData(e)">Delete</button>
          </td>
        </ng-container>

        <!-- HEADER -->
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

        <!-- ROWS -->
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>

      <!-- No data row -->
      <div class="no-data" *ngIf="!dataSource || dataSource.data.length === 0">No data to display</div>
    </div>
    <!-- pagination-->
    <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of users" class="pagination"></mat-paginator>
  </div>
</div>
