<div class="form-section">
  <!-- title of the form-->
  <div class="title">
    <h2 class="form-title">Assign Trainer</h2>
    <button mat-icon-button class="close-icon" style="padding: 0px" (click)="closeDialog()">
      <mat-icon fontIcon="close"></mat-icon>
    </button>
  </div>

  <!--- form -->
  <form [formGroup]="assignTrainerForm" class="example-form" (ngSubmit)="onSubmit()">
    <div class="row">
      <mat-form-field appearance="outline" class="half-width">
        <mat-label>Select Member</mat-label>
        <mat-select formControlName="member">
          <mat-option *ngFor="let member of memberList" [value]="member.firstName">
            {{ member.firstName }}
          </mat-option>
        </mat-select>
                          <span class="required-message" *ngIf="submitted && assignTrainerForm.get('member').invalid">
          <ng-container *ngIf="assignTrainerForm.get('member').hasError('required')">Member is required</ng-container>
        </span>
      </mat-form-field>

      <mat-form-field appearance="outline" class="half-width">
        <mat-label>Select Trainer</mat-label>
        <mat-select formControlName="trainer">
          <mat-option *ngFor="let trainer of trainerList" [value]="trainer.firstName">
            {{ trainer.firstName }}
          </mat-option>
        </mat-select>
                          <span class="required-message" *ngIf="submitted && assignTrainerForm.get('trainer').invalid">
          <ng-container *ngIf="assignTrainerForm.get('trainer').hasError('required')">Trainer is required</ng-container>
        </span>
      </mat-form-field>
    </div>

    <div class="row">
      <button type="submit" mat-raised-button class="register-button half-width" [disabled]="submitDisabled">
        {{ registerButtonLabel }}
      </button>
      <button type="reset" mat-raised-button class="reset-button half-width" (click)="resetData()">Reset</button>
    </div>
  </form>
</div>
