<div class="dialog-container">

  <!-- Header -->
  <div class="dialog-header">
    <h3>Member Login</h3>
    <button type="button" class="close-btn" (click)="closeDialog()">✕</button>
  </div>

  <!-- Form -->
  <form [formGroup]="memberLoginForm" (ngSubmit)="onSubmit()" class="dialog-body">

    <!-- Member Select -->
    <div class="row">
      <div class="field">
        <label>Select Member *</label>
        <select formControlName="memberId" class="select-input">
          <option [ngValue]="null" disabled>Select Member</option>
          <option *ngFor="let member of memberList" [ngValue]="member.id">
            {{ member.memberNo }} - {{ member.firstName }} {{ member.lastName }}
          </option>
        </select>
        <span class="required-message" *ngIf="submitted && memberLoginForm.get('memberId')?.invalid">
          Please select a member
        </span>
      </div>
    </div>

    <!-- First Name + Last Name -->
    <div class="row">
      <div class="field">
        <label>First Name</label>
        <input type="text" placeholder="Enter First Name" formControlName="firstName" />
      </div>
      <div class="field">
        <label>Last Name</label>
        <input type="text" placeholder="Enter Last Name" formControlName="lastName" />
      </div>
    </div>

    <!-- Username -->
    <div class="row">
      <div class="field">
        <label>Username *</label>
        <input type="text" placeholder="Enter Username" formControlName="userName" />
        <span class="required-message" *ngIf="submitted && memberLoginForm.get('userName')?.invalid">
          Username is required
        </span>
      </div>
    </div>

    <!-- Password -->
    <div class="row">
      <div class="field">
        <label>{{ mode === 'edit' ? 'New Password' : 'Password *' }}</label>
        <div class="input-wrapper">
          <input
            [type]="showPassword ? 'text' : 'password'"
            placeholder="Enter Password"
            formControlName="password"
          />
          <button type="button" class="eye-btn" (click)="togglePassword()">
            <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
              fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
            <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
              fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
              <line x1="1" y1="1" x2="23" y2="23" />
            </svg>
          </button>
        </div>
        <small class="password-hint" *ngIf="mode === 'edit'">Leave blank to keep the current password.</small>
        <small class="password-hint" *ngIf="mode === 'add'">Minimum 6 characters.</small>
        <span class="required-message" *ngIf="submitted && memberLoginForm.get('password')?.invalid">
          <ng-container *ngIf="memberLoginForm.get('password')?.hasError('required')">Password is required</ng-container>
          <ng-container *ngIf="memberLoginForm.get('password')?.hasError('minlength')">Password must be at least 6 characters</ng-container>
        </span>
      </div>
    </div>

    <!-- Actions -->
    <div class="action">
      <button type="button" class="btn secondary" (click)="closeDialog()">Cancel</button>
      <button type="submit" class="btn primary">
        {{ mode === 'edit' ? 'Update' : 'Save' }}
      </button>
    </div>

  </form>

</div>
