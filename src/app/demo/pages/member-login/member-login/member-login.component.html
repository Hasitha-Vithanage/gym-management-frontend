<div class="container">
  <!-- Table Section to the Right of Form -->
  <div class="table-section">
    <!-- title of the-->
    <h2 class="form-title">Member Login</h2>

    <div class="toolbar">
      <!-- add-new on the left -->
      <div class="add-new">
        <button type="reset" mat-raised-button class="new-button half-width" (click)="openDialog()">
          <mat-icon>add</mat-icon>
          Register Member Login
        </button>
      </div>

      <!-- table filter-->
      <div class="table-filter">
        <mat-form-field appearance="outline">
          <mat-label>
            <mat-icon class="search-icon">search</mat-icon>
            Search...
          </mat-label>
          <input matInput (keyup)="applyFilter($event)" placeholder="" #input />
        </mat-form-field>

        <!-- refresh button-->
        <div>
          <button mat-icon-button (click)="refreshData()" class="refresh-button">
            <mat-icon>refresh</mat-icon>
          </button>
        </div>
      </div>
    </div>

    <!-- Example Table (You can replace this with your table) -->
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
      <!--- Note that these columns can be defined in any order.
            The actual rendered columns are set as a property on the row definition" -->

      <!-- employeeId Column -->
      <ng-container matColumnDef="firstName">
        <th mat-header-cell *matHeaderCellDef>First Name</th>
        <td mat-cell *matCellDef="let element">{{ element.firstName }}</td>
      </ng-container>

      <!-- jobTitle Column -->
      <ng-container matColumnDef="lastName">
        <th mat-header-cell *matHeaderCellDef>Last Name</th>
        <td mat-cell *matCellDef="let element">{{ element.lastName }}</td>
      </ng-container>

      <!-- jobTitle Column -->
      <ng-container matColumnDef="userName">
        <th mat-header-cell *matHeaderCellDef>Username</th>
        <td mat-cell *matCellDef="let element">{{ element.userName }}</td>
      </ng-container>

      <!-- action Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef style="text-align: center;">Actions</th>
        <td mat-cell *matCellDef="let element">
          <div class="action-column">
            <button mat-icon-button class="gray-icon-btn" matTooltip="Edit" (click)="editData(element)">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button class="gray-icon-btn" matTooltip="Delete" (click)="deleteData(element)">
              <mat-icon>delete</mat-icon>
            </button>

          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <!-- pagination-->
    <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of users" class="pagination"></mat-paginator>
  </div>
</div>
