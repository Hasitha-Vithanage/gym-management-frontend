<div class="form-section">
  <div class="title">
    <h2 class="form-title">Add New Supplier</h2>
    <button class="close-icon" (click)="closeDialog()">&#x2715;</button>
  </div>

  <form [formGroup]="supplierForm" (ngSubmit)="onSubmit()">
    <div class="row">
      <div class="half-width">
        <label for="supplierName">Supplier Name</label>
        <input id="supplierName" type="text" maxlength="20" placeholder="Enter Supplier Name" formControlName="supplierName" />
      </div>

      <div class="half-width">
        <label for="contactPerson">Contact Person</label>
        <input id="contactPerson" type="text" maxlength="20" placeholder="Enter Contact Person" formControlName="contactPerson" />
      </div>
    </div>

    <div class="row">
      <div class="half-width">
        <label for="contactNo">Contact No</label>
        <input id="contactNo" type="text" maxlength="10" placeholder="Enter Contact No" formControlName="contactNo" />
      </div>

      <div class="half-width">
        <label for="emailAddress">Email Address</label>
        <input id="emailAddress" type="text" maxlength="50" placeholder="Enter Email Address" formControlName="emailAddress" />
      </div>
    </div>

    <div class="row">
      <div class="half-width">
        <label for="officeAddress">Office Address</label>
        <input id="officeAddress" type="text" maxlength="100" placeholder="Enter Office Address" formControlName="officeAddress" />
      </div>

      <div class="half-width">
        <label for="postalAddress">Postal Address</label>
        <input id="postalAddress" type="text" maxlength="100" placeholder="Enter Postal Address" formControlName="postalAddress" />
      </div>
    </div>

    <div class="row">
      <div class="half-width">
        <p class="field-label">Supply Type</p>
        <div formGroupName="equipmentType" class="checkbox-group">
          <label class="checkbox-item">
            <input type="checkbox" formControlName="machines" /> Machines
          </label>
          <label class="checkbox-item">
            <input type="checkbox" formControlName="freeweights" /> Freeweights &amp; Bars
          </label>
          <label class="checkbox-item">
            <input type="checkbox" formControlName="other" /> Other
          </label>
          <label class="checkbox-item">
            <input type="checkbox" formControlName="supplements" /> Supplements
          </label>
        </div>
      </div>

      <div class="half-width">
        <p class="field-label">Status</p>
        <div class="status-toggle-group">
          <label class="toggle-option" [class.active]="supplierForm.get('status').value === true">
            <input type="radio" formControlName="status" [value]="true" /> Active
          </label>
          <label class="toggle-option" [class.active]="supplierForm.get('status').value === false">
            <input type="radio" formControlName="status" [value]="false" /> Inactive
          </label>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="full-width">
        <label for="remarks">Remarks</label>
        <textarea id="remarks" maxlength="1000" placeholder="Enter Remarks" formControlName="remarks"></textarea>
      </div>
    </div>

    <div class="row">
      <button type="button" class="close-button half-width" (click)="closeDialog()">Close</button>
      <button type="submit" class="submit-button half-width">{{ saveButtonLabel }}</button>
    </div>
  </form>
</div>
