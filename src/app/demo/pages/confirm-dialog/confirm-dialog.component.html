<h2 mat-dialog-title>{{data.title || "Confirmation"}}</h2>
<div style="display: flex; align-items: center; margin-top: 10px; margin-bottom: 20px; margin-left: 10px; margin-right: 2px;">
  <img src="../../../../assets/images/icon/exclamation-icon-orange.png" style="margin-right: 5px;" />
<mat-dialog-content style="padding-left: 10px;">{{ data?.message }}</mat-dialog-content>
</div>
<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">No</button>
  <button mat-raised-button color="warn" (click)="onConfirm()">Yes</button>
</mat-dialog-actions>
