<div class="form-section">
  <div class="dialog-header">
    <div class="header-title-group">
      <mat-icon class="header-icon">construction</mat-icon>
      <div>
        <h2 class="form-title">{{ saveButtonLabel === 'Update' ? 'Edit Equipment' : 'Add New Equipment' }}</h2>
        <p class="dialog-sub">{{ saveButtonLabel === 'Update' ? 'Update the equipment record details' : 'Register a new item in the equipment catalogue' }}</p>
      </div>
    </div>
    <button class="close-btn" (click)="closeDialog()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <form [formGroup]="equipmentForm" (ngSubmit)="onSubmit()">
    <div class="row">
      <div class="half-width">
        <label for="category">Category <span class="required">*</span></label>
        <select id="category" formControlName="category">
          <option value="" disabled>-- Select Category --</option>
          <option value="Machines">Machines</option>
          <option value="Freeweights">Freeweights &amp; Bars</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div class="half-width">
        <label for="supplier">Supplier <span class="required">*</span></label>
        <select id="supplier" formControlName="supplier">
          <option value="" disabled>-- Select Supplier --</option>
          <option *ngFor="let supplier of supplierList" [value]="supplier.id">{{ supplier.supplierName }}</option>
        </select>
      </div>
    </div>

    <div class="row" *ngIf="equipmentForm.get('category')?.value === 'Machines'">
      <div class="half-width">
        <label for="machineName">Machine Name</label>
        <input id="machineName" type="text" maxlength="20" placeholder="Enter Machine Name" formControlName="machineName" />
      </div>

      <div class="half-width">
        <label for="muscleGroups">Muscle Groups</label>
        <select id="muscleGroups" formControlName="muscleGroups" multiple class="select-multiple">
          <option *ngFor="let group of muscleGroupsList" [value]="group">{{ group }}</option>
        </select>
      </div>
    </div>

    <div class="row">
      <div class="half-width">
        <label for="brandName">Brand Name</label>
        <input id="brandName" type="text" maxlength="20" placeholder="Enter Brand Name" formControlName="brandName" />
      </div>

      <div class="half-width" *ngIf="equipmentForm.get('category')?.value === 'Machines'">
        <label for="model">Model</label>
        <input id="model" type="text" maxlength="50" placeholder="Enter Model Name or Number" formControlName="model" />
      </div>
    </div>

    <div class="row" *ngIf="equipmentForm.get('category')?.value === 'Freeweights'">
      <div class="half-width">
        <label for="type">Type</label>
        <select id="type" formControlName="type">
          <option value="" disabled>-- Select Type --</option>
          <option value="Dumbbells">Dumbbells</option>
          <option value="Plates">Plates</option>
          <option value="Kettlebells">Kettlebells</option>
          <option value="Bars">Bars</option>
        </select>
      </div>

      <div class="half-width" *ngIf="equipmentForm.get('type')?.value === 'Bars'">
        <label for="sizeStandard">Size Standard</label>
        <select id="sizeStandard" formControlName="sizeStandard">
          <option value="" disabled>-- Select Standard --</option>
          <option value="Olympic">Olympic Bars</option>
          <option value="Regular">Regular Bars</option>
        </select>
      </div>
    </div>

    <div class="row">
      <div class="half-width" *ngIf="['Bars'].includes(equipmentForm.get('type')?.value)">
        <label for="barLength">Bar Length</label>
        <select id="barLength" formControlName="barLength">
          <option value="" disabled>-- Select Length --</option>
          <option *ngIf="equipmentForm.get('sizeStandard')?.value === 'Olympic'" value="7 feet">7 feet (Standard Olympic Bar)</option>
          <option *ngIf="equipmentForm.get('sizeStandard')?.value === 'Olympic'" value="6.5 feet">6.5 feet (Short Olympic Bar)</option>
          <option *ngIf="equipmentForm.get('sizeStandard')?.value === 'Olympic'" value="8 feet">8 feet (Long Olympic Bar)</option>
          <option *ngIf="equipmentForm.get('sizeStandard')?.value === 'Olympic'" value="5 feet">5 feet (Mini Olympic Bar)</option>
          <option *ngIf="equipmentForm.get('sizeStandard')?.value === 'Olympic'" value="12 inches">12 inches (Standard Olympic Dumbbell Bar)</option>
          <option *ngIf="equipmentForm.get('sizeStandard')?.value === 'Regular'" value="12 inches">12 inches (Dumbbell Bar)</option>
          <option *ngIf="equipmentForm.get('sizeStandard')?.value === 'Regular'" value="14 inches">14 inches (Dumbbell Bar)</option>
          <option *ngIf="equipmentForm.get('sizeStandard')?.value === 'Regular'" value="16 inches">16 inches (Dumbbell Bar)</option>
          <option *ngIf="equipmentForm.get('sizeStandard')?.value === 'Regular'" value="18 inches">18 inches (Dumbbell Bar)</option>
          <option *ngIf="equipmentForm.get('sizeStandard')?.value === 'Regular'" value="20 inches">20 inches (Dumbbell Bar)</option>
          <option *ngIf="equipmentForm.get('sizeStandard')?.value === 'Regular'" value="5 feet">5 feet (Standard Bar)</option>
          <option *ngIf="equipmentForm.get('sizeStandard')?.value === 'Regular'" value="6 feet">6 feet (Standard Bar)</option>
          <option *ngIf="equipmentForm.get('sizeStandard')?.value === 'Regular'" value="4 feet">4 feet (Curl Bar)</option>
          <option *ngIf="equipmentForm.get('sizeStandard')?.value === 'Regular'" value="7 feet">7 feet (Trap Bar)</option>
        </select>
      </div>

      <div class="half-width" *ngIf="['Dumbbells','Plates','Kettlebells'].includes(equipmentForm.get('type')?.value)">
        <label for="weight">Weight (kg)</label>
        <input id="weight" type="number" maxlength="3" placeholder="Enter Weight (kg)" formControlName="weight" />
      </div>
    </div>

    <div class="row">
      <div class="half-width" *ngIf="equipmentForm.get('category')?.value === 'Other'">
        <label for="equipmentName">Equipment Name</label>
        <input id="equipmentName" type="text" maxlength="20" placeholder="Enter Equipment Name" formControlName="equipmentName" />
      </div>

      <div class="half-width">
        <label for="quantity">Quantity <span class="required">*</span></label>
        <input id="quantity" type="number" placeholder="Enter Quantity" formControlName="quantity" />
      </div>
    </div>

    <div class="row">
      <div class="half-width">
        <label for="condition">Condition</label>
        <select id="condition" formControlName="condition">
          <option value="" disabled>-- Select Condition --</option>
          <option value="New">New</option>
          <option value="Good">Good</option>
          <option value="Poor">Poor</option>
          <option value="Out of Service">Out of Service</option>
        </select>
      </div>

      <div class="half-width">
        <label for="purchaseDate">Purchase Date <span class="required">*</span></label>
        <input id="purchaseDate" type="date" formControlName="purchaseDate" />
      </div>

      <div class="half-width">
        <label for="addedBy">Added By <span class="required">*</span></label>
        <input id="addedBy" type="text" formControlName="addedBy" />
      </div>
    </div>

    <div class="row">
      <div class="full-width">
        <label for="remarks">Remarks</label>
        <textarea id="remarks" maxlength="1000" placeholder="Enter Remarks" formControlName="remarks"></textarea>
      </div>
    </div>

    <div class="row">
      <button type="button" class="close-button half-width" (click)="closeDialog()">Close</button>
      <button type="submit" class="submit-button half-width" [disabled]="!equipmentForm.valid">{{ saveButtonLabel }}</button>
    </div>
  </form>
</div>
