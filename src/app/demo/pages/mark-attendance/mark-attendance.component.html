      <!-- Status Radio -->
      <!-- <div class="status-radio-group">
        <label>Attendance Status:</label>

      <div class="input-group">
        <label>Attendance Date</label>
        <input type="date" formControlName="attendanceDate" />
        <span class="required-message" *ngIf="submitted && attendanceForm.get('attendanceDate').invalid">
          <ng-container *ngIf="attendanceForm.get('attendanceDate').hasError('required')">Attendance Date is
            required</ng-container>
          <ng-container *ngIf="attendanceForm.get('attendanceDate').hasError('futureDate')">Future dates not
            allowed</ng-container>
        </span>
      </div>

      <div class="input-group">
        <label>Select Attendance Type</label>
        <select formControlName="attendanceType">
          <option value="">~ Select ~</option>
          <option value="employee">Employee</option>
          <option value="member">Member</option>
        </select>
        <span class="required-message" *ngIf="submitted && attendanceForm.get('attendanceType').hasError('required')">
          Attendance type is required
        </span>
      </div>

      <div class="input-group" *ngIf="attendanceForm.get('attendanceType')?.value === 'employee'">
        <label>Select Employee</label>
        <select formControlName="employee">
          <option value="">~ Select ~</option>
          <option *ngFor="let emp of employeeList" [value]="emp.employeeId">{{ emp.firstName }} {{ emp.lastName }}
          </option>
        </select>
        <span class="required-message" *ngIf="submitted && attendanceForm.get('attendanceType').hasError('required')">
          Attendance type is required
        </span>
      </div>

      <div class="input-group" *ngIf="attendanceForm.get('attendanceType')?.value === 'member'">
        <label>Select Member</label>
        <select formControlName="member">
          <option value="">~ Select ~</option>
          <option *ngFor="let mem of memberList" [value]="mem.memberNo">{{ mem.firstName }} {{ mem.lastName }}</option>
        </select>
        <span class="required-message" *ngIf="submitted && attendanceForm.get('attendanceType').hasError('required')">
          Attendance type is required
        </span>
      </div>

      <div class="input-group half-width">
        <label>Attendance Status:</label>
        <div class="radio-group">
          <label><input type="radio" value="Present" formControlName="attendanceStatus" /> Present</label>
          <label><input type="radio" value="Absent" formControlName="attendanceStatus" /> Absent</label>
        </div>
        <span class="required-message" *ngIf="submitted && attendanceForm.get('attendanceStatus').invalid">
          Attendance status is required
        </span>
      </div>

      <!-- Submit -->
      <button mat-raised-button color="" class="submit-btn full-width">Submit Attendance</button>
    </form>
  </mat-card>
</div>
