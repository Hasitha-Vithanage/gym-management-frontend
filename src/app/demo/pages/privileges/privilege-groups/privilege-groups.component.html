<div class="container">
  <div class="table-section" *ngIf="display">
    <h2 class="form-title">
      <img src="../../../../assets/images/icon/privilege-groups-icon-dark.png" style="margin-right: 5px" />
      Privilege Groups
    </h2>

    <div class="toolbar">
      <div class="add-new">
        <button type="reset" mat-raised-button class="new-button half-width" (click)="openPrivilegeGroupAddEditClick()">
          <img src="../../../../assets/images/icon/add-light-icon.png"
            style="margin-right: 5px; height: 18px; width: 18px" />
          ADD GROUP
        </button>
      </div>

      <!-- table filter-->
      <div class="table-filter">
        <!-- Search bar -->
        <div class="search-bar">
          <img src="../../../../assets/images/icon/search-icon.png"
            style="margin-right: 5px; height: 18px; width: 18px" />
          <input type="text" placeholder="Search..." (keyup)="applyFilter($event)" />
        </div>

        <!-- refresh button-->
        <button mat-icon-button class="refresh-button" (click)="refreshData()">
          <img src="../../../../assets/images/icon/refresh-icon.png"
            style="margin-right: 5px; height: 18px; width: 18px" />
        </button>
      </div>
    </div>

    <div class="table-wrapper">
      <table mat-table [dataSource]="dataSource" matSort>
        <!-- ID Column -->
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Group ID</th>
          <td mat-cell *matCellDef="let row">{{ row.id }}</td>
        </ng-container>

        <!-- Group Name Column -->
        <ng-container matColumnDef="groupName">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Group Name</th>
          <td mat-cell *matCellDef="let row">{{ row.groupName }}</td>
        </ng-container>

        <!-- Group Description Column -->

        <ng-container matColumnDef="groupDescription">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Group Description</th>
          <td mat-cell *matCellDef="let row">{{ row.groupDescription }}</td>
        </ng-container>

        <ng-container matColumnDef="action">
          <th style="text-align: center" mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let row" style="justify-content: center; display: flex;">
            <div class="action-column">
              <button mat-icon-button class="gray-icon-btn" matTooltip="Edit" (click)="onEditPrivilageGroupClick(row)">
                <img src="../../../../assets/images/icon/edit-icon.png"
                  style="margin-right: 5px; height: 18px; width: 18px;">
              </button>
              <button mat-icon-button class="gray-icon-btn" matTooltip="Delete"
                (click)="onDeletePrivilageGroupClick(row.id, row)">
                <img src="../../../../assets/images/icon/delete-icon.png"
                  style="margin-right: 5px; height: 18px; width: 18px;">
              </button>
            </div>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns" [cdkContextMenuTriggerFor]="row_menu"
          [ngClass]="{ highlight: selectedRowIndex == row.id }" (mouseup)="detectRightMouseClick($event, row)"></tr>

        <!-- Row shown when there is no matching data. -->
        <!-- <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell" colspan="4">No data matching the filter "{{ input.value }}"</td>
          </tr> -->
      </table>

      <!-- No data row -->
      <ng-container *ngIf="dataSource.data.length === 0">
        <ng-container matColumnDef="noData" class="no-data">
          <td mat-cell [attr.colspan]="displayedColumns.length" class="no-data">No records found</td>
        </ng-container>

        <tr mat-row *matRowDef="let row; columns: ['noData']"></tr>
      </ng-container>

      <ng-template #row_menu>
        <ul class="menu" cdkMenu>
          <li (click)="onAddRemovePrivilegesClick()">
            <a>
              <i class="fa fa-eye" aria-hidden="true"></i>
              Add Remove Privileges
            </a>
          </li>
          <li (click)="onAddRemoveUsersClick()">
            <a>
              <i class="fa fa-eye" aria-hidden="true"></i>
              Add Remove Users
            </a>
          </li>
        </ul>
      </ng-template>
    </div>

    <!-- pagination-->
    <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of users" class="pagination">
    </mat-paginator>

    <!-- <div class="main-body">
      <mat-form-field>
        <mat-label>Filter</mat-label>
        <input matInput (keyup)="applyFilter($event)" placeholder="Ex. Admin" #input />
      </mat-form-field>

      <div class="table-container">
        <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of users"></mat-paginator>
      </div>
    </div> -->
  </div>
</div>
