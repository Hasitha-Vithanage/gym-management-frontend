<div class="container">
  <!-- Table Section to the Right of Form -->
  <div class="table-section">
    <!-- title of the-->
    <h2 class="form-title">Feedback History</h2>

    <div class="toolbar">

      <!-- table filter-->
      <div class="table-filter">
        <mat-form-field appearance="outline">
          <mat-label>
            <mat-icon class="search-icon">search</mat-icon>
            Search...
          </mat-label>
          <input matInput (keyup)="applyFilter($event)" placeholder="" #input />
        </mat-form-field>

        <!-- refresh button-->
        <div>
          <button mat-icon-button (click)="refreshData()" class="refresh-button">
            <mat-icon>refresh</mat-icon>
          </button>
        </div>
      </div>
    </div>

    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
      <!-- employeeId Column -->
      <ng-container matColumnDef="category">
        <th mat-header-cell *matHeaderCellDef>Category</th>
        <td mat-cell *matCellDef="let element">{{ element.category }}</td>
      </ng-container>

      <!-- jobTitle Column -->
      <ng-container matColumnDef="trainer">
        <th mat-header-cell *matHeaderCellDef>Trainer</th>
        <td mat-cell *matCellDef="let element">{{ element.trainer || 'N/A' }}</td>
      </ng-container>

      <!-- dateOfJoining Column -->
      <!-- | date:'dd/MM/yyyy' -->
      <ng-container matColumnDef="rating">
        <th mat-header-cell *matHeaderCellDef>Rating</th>
        <td mat-cell *matCellDef="let element">{{ element.rating }} Stars</td>
      </ng-container>

      <!-- firstName Column -->
      <ng-container matColumnDef="feedback">
        <th mat-header-cell *matHeaderCellDef>Feedback</th>
        <td mat-cell *matCellDef="let element">{{ element.feedback }}</td>
      </ng-container>

      <!-- lastName Column -->
      <ng-container matColumnDef="submittedDate">
        <th mat-header-cell *matHeaderCellDef>Submitted Date</th>
        <td mat-cell *matCellDef="let element">{{ element.date | date: 'dd/MM/yyyy' }}</td>
      </ng-container>

      <!-- nic Column -->
      <ng-container matColumnDef="submittedBy">
        <th mat-header-cell *matHeaderCellDef>Submitted By</th>
        <td mat-cell *matCellDef="let element">{{ element.username }}</td>
      </ng-container>

      <!-- action Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let element">
          <div class="action-column">
            <button mat-icon-button class="gray-icon-btn" matTooltip="Delete" (click)="deleteData(element)">
              <mat-icon>delete</mat-icon>
            </button>
          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <!-- pagination-->
    <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of users" class="pagination"></mat-paginator>
  </div>
</div>
