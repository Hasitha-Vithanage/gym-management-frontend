<div class="dialog-container">

  <!-- Header -->
  <div class="dialog-header">
    <h3>Employee Login</h3>
    <button type="button" class="close-btn" (click)="closeDialog()">✕</button>
  </div>

  <!-- Form -->
  <form [formGroup]="trainerLoginForm" (ngSubmit)="onSubmit()" class="dialog-body">

    <!-- Trainer Select -->
    <div class="row">
      <div class="field">
        <label>Select Trainer *</label>
        <select formControlName="trainerId" class="select-input">
          <option [ngValue]="null" disabled>Select Trainer</option>
          <option *ngFor="let trainer of trainerList" [ngValue]="trainer.id">
            {{ trainer.firstName }} {{ trainer.lastName }} — {{ trainer.jobTitle }}
          </option>
        </select>
      </div>
    </div>

    <!-- First Name + Last Name -->
    <div class="row">
      <div class="field">
        <label>First Name</label>
        <input type="text" placeholder="Enter First Name" formControlName="firstName" />
      </div>
      <div class="field">
        <label>Last Name</label>
        <input type="text" placeholder="Enter Last Name" formControlName="lastName" />
      </div>
    </div>

    <!-- Username -->
    <div class="row">
      <div class="field">
        <label>Username *</label>
        <input type="text" placeholder="Enter Username" formControlName="userName" />
      </div>
    </div>

    <!-- Password -->
    <div class="row">
      <div class="field">
        <label>Password *</label>
        <div class="input-wrapper">
          <input [type]="showPassword ? 'text' : 'password'" placeholder="Enter Password" formControlName="password" />
          <button type="button" class="eye-btn" (click)="togglePassword()">
            <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
              fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
            <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
              fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
              <line x1="1" y1="1" x2="23" y2="23" />
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Actions -->
    <div class="action">
      <button type="button" class="btn secondary" (click)="closeDialog()">Cancel</button>
      <button type="submit" class="btn primary" [disabled]="trainerLoginForm.invalid">
        {{ mode === 'edit' ? 'Update' : 'Save' }}
      </button>
    </div>

  </form>

</div>
