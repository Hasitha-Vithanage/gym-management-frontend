<div class="container">
  <div class="table-section">

    <h2 class="form-title">
      <img src="../../../../assets/images/icon/supplement-inventory-icon-dark.png"
        style="margin-right:5px;height:18px;width:18px" />
      Manage Supplements
    </h2>

    <div class="toolbar">
      <div class="add-new">
        <button mat-raised-button class="new-button" (click)="openAddDialog()">
          <img src="../../../../assets/images/icon/add-light-icon.png"
            style="margin-right:5px;height:18px;width:18px" />
          Add New Supplement
        </button>
      </div>
      <div class="table-filter">
        <div class="search-bar">
          <img src="../../../../assets/images/icon/search.png"
            style="margin-right:5px;height:18px;width:18px" />
          <input type="text" placeholder="Search..." (keyup)="applyFilter($event)" />
        </div>
        <button mat-icon-button class="refresh-button" (click)="refreshData()">
          <img src="../../../../assets/images/icon/refresh.png" style="height:18px;width:18px" />
        </button>
      </div>
    </div>

    <div class="table-wrapper">
      <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8">

        <ng-container matColumnDef="productName">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Product Name</th>
          <td mat-cell *matCellDef="let p">{{ p.productName }}</td>
        </ng-container>

        <ng-container matColumnDef="brand">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Brand</th>
          <td mat-cell *matCellDef="let p">{{ p.brand || '—' }}</td>
        </ng-container>

        <ng-container matColumnDef="category">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Category</th>
          <td mat-cell *matCellDef="let p">{{ p.category }}</td>
        </ng-container>

        <ng-container matColumnDef="price">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Price</th>
          <td mat-cell *matCellDef="let p">Rs. {{ p.price | number:'1.2-2' }}</td>
        </ng-container>

        <ng-container matColumnDef="stockQty">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Stock</th>
          <td mat-cell *matCellDef="let p">
            <span [ngClass]="p.stockQty === 0 ? 'stock-badge out' : p.stockQty <= 5 ? 'stock-badge low' : 'stock-badge ok'">
              {{ p.stockQty }} units
            </span>
          </td>
        </ng-container>

        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Status</th>
          <td mat-cell *matCellDef="let p">
            <span [ngClass]="p.isActive ? 'status-badge active' : 'status-badge inactive'">
              {{ p.isActive ? 'Active' : 'Hidden' }}
            </span>
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th style="text-align:center" mat-header-cell *matHeaderCellDef>Actions</th>
          <td style="display:flex;justify-content:center" mat-cell *matCellDef="let p">
            <div class="action-column">
              <button mat-icon-button class="gray-icon-btn" matTooltip="Edit" (click)="editData(p)">
                <img src="../../../../assets/images/icon/edit-light.png" style="height:18px;width:18px">
              </button>
              <button mat-icon-button class="gray-icon-btn" matTooltip="Delete" (click)="deleteData(p)">
                <img src="../../../../assets/images/icon/delete-light.png" style="height:18px;width:18px">
              </button>
            </div>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

        <tr *ngIf="dataSource?.data?.length === 0">
          <td [attr.colspan]="displayedColumns.length" class="no-data">No supplements found</td>
        </tr>

      </table>
    </div>

    <mat-paginator [pageSizeOptions]="[5, 10, 25]" class="pagination"></mat-paginator>

  </div>
</div>
