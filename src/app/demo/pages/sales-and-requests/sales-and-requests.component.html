<div class="container">
  <!-- Table Section to the Right of Form -->
  <div class="table-section">
    <!-- title of the-->
    <h2 class="form-title"><img src="../../../../assets/images/icon/sales-and-request-dark.png"
        style="margin-right: 5px;">Sales & Request</h2>

    <div class="toolbar">
      <!-- add-new on the left -->
      <div class="add-new">
        <button type="reset" mat-raised-button class="new-button half-width" style="display: none;">
          <img src="../../../../assets/images/icon/add-light-icon.png"
            style="margin-right: 5px; height: 18px; width: 18px;">
          Add New Employee
        </button>
      </div>

      <div class="table-filter">
        <!-- Search bar -->
        <div class="search-bar">
          <img src="../../../../assets/images/icon/search-icon.png"
            style="margin-right: 5px; height: 18px; width: 18px;">
          <input type="text" placeholder="Search..." (keyup)="applyFilter($event)" />
        </div>

        <!-- refresh button-->
        <button mat-icon-button class="refresh-button" (click)="refreshData()">
          <img src="../../../../assets/images/icon/refresh-icon.png"
            style="margin-right: 5px; height: 18px; width: 18px;">
        </button>
      </div>
    </div>

    <div class="table-wrapper">
      <table mat-table [dataSource]="orders" class="mat-elevation-z8">

        <!-- Ordered By -->
        <ng-container matColumnDef="orderedBy">
          <th mat-header-cell *matHeaderCellDef> Ordered By </th>
          <td mat-cell *matCellDef="let element"> {{ element.orderedBy }} </td>
        </ng-container>

        <!-- Date -->
        <ng-container matColumnDef="date">
          <th mat-header-cell *matHeaderCellDef style="text-align: center;"> Date </th>
          <td mat-cell *matCellDef="let element" style="text-align: center;"> {{ element.date | date:'dd/MM/yyyy' }}
          </td>
        </ng-container>


        <!-- Product Name -->
        <ng-container matColumnDef="productName">
          <th mat-header-cell *matHeaderCellDef> Product </th>
          <td mat-cell *matCellDef="let element"> {{ element.status }} </td>
        </ng-container>


        <!-- Total Price -->
        <ng-container matColumnDef="totalPrice">
          <th mat-header-cell *matHeaderCellDef> Total Price </th>
          <td mat-cell *matCellDef="let element"> {{ element.totalCost }} LKR </td>
        </ng-container>

        <!-- action Column -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef style="text-align: center;">Actions</th>
          <td style="display: flex; justify-content: center;" mat-cell *matCellDef="let element">
            <div class="action-column">
              <button mat-icon-button class="gray-icon-btn" matTooltip="Edit" (click)="viewOrder(element)">
                <img src="../../../../assets/images/icon/view-icon-dark.png"
                  style="margin-right: 5px; height: 18px; width: 18px;">
              </button>
            </div>
          </td>
        </ng-container>


        <!-- Rows -->
        <tr mat-header-row *matHeaderRowDef="orderItemDisplayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: orderItemDisplayedColumns"></tr>

      </table>

    </div>

    <!-- pagination-->
    <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of users"
      class="pagination">
    </mat-paginator>
  </div>
</div>
