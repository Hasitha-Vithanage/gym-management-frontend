<div class="container">
  <!-- Table Section to the Right of Form -->
  <div class="table-section">
    <!-- title of the-->
    <h2 class="form-title">Sales & Request</h2>

    <!-- table filter-->
    <div class="table-filter">
      <mat-form-field appearance="outline">
        <mat-label>
          <mat-icon class="search-icon">search</mat-icon>
          Search...
        </mat-label>
        <input matInput (keyup)="applyFilter($event)" placeholder="" #input />
      </mat-form-field>

      <!-- refresh button-->
      <div>
        <button mat-icon-button (click)="refreshData()" class="refresh-button">
          <mat-icon>refresh</mat-icon>
        </button>
      </div>
    </div>

    <!-- Example Table (You can replace this with your table) -->
<table mat-table [dataSource]="orderItemsFlattened" class="mat-elevation-z8">

  <!-- Ordered By -->
  <ng-container matColumnDef="orderedBy">
    <th mat-header-cell *matHeaderCellDef> Ordered By </th>
    <td mat-cell *matCellDef="let element"> {{ element.orderedBy }} </td>
  </ng-container>

  <!-- Product Name -->
  <ng-container matColumnDef="productName">
    <th mat-header-cell *matHeaderCellDef> Product </th>
    <td mat-cell *matCellDef="let element"> {{ element.productName }} </td>
  </ng-container>

  <!-- Quantity -->
  <ng-container matColumnDef="quantity">
    <th mat-header-cell *matHeaderCellDef> Qty </th>
    <td mat-cell *matCellDef="let element"> {{ element.quantity }} </td>
  </ng-container>

  <!-- Total Price -->
  <ng-container matColumnDef="totalPrice">
    <th mat-header-cell *matHeaderCellDef> Total Price </th>
    <td mat-cell *matCellDef="let element"> {{ element.totalPrice | currency }} </td>
  </ng-container>

  <!-- Date -->
  <ng-container matColumnDef="date">
    <th mat-header-cell *matHeaderCellDef> Date </th>
    <td mat-cell *matCellDef="let element"> {{ element.date | date:'dd/MM/yyyy' }} </td>
  </ng-container>

  <!-- Rows -->
  <tr mat-header-row *matHeaderRowDef="orderItemDisplayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: orderItemDisplayedColumns"></tr>

</table>


    <!-- pagination-->
    <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of users" class="pagination"></mat-paginator>
  </div>
</div>
