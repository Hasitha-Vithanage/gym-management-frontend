<div class="container">
  <div class="table-section">

    <h2 class="form-title">
      <img src="../../../../assets/images/icon/template-light.png"
        style="margin-right:5px;height:18px;width:18px" />
      Meal Plan Templates
    </h2>

    <div class="toolbar">
      <div class="add-new">
        <button mat-raised-button class="new-button" (click)="openAddDialog()">
          <img src="../../../../assets/images/icon/add-light-icon.png"
            style="margin-right:5px;height:18px;width:18px" />
          Add New Template
        </button>
      </div>
      <div class="table-filter">
        <div class="search-bar">
          <img src="../../../../assets/images/icon/search.png"
            style="margin-right:5px;height:18px;width:18px" />
          <input type="text" placeholder="Search..." (keyup)="applyFilter($event)" />
        </div>
        <button mat-icon-button class="refresh-button" (click)="refreshData()">
          <img src="../../../../assets/images/icon/refresh.png" style="height:18px;width:18px" />
        </button>
      </div>
    </div>

    <div class="table-wrapper">
      <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

        <ng-container matColumnDef="templateName">
          <th mat-header-cell *matHeaderCellDef>Template Name</th>
          <td mat-cell *matCellDef="let t">{{ t.templateName }}</td>
        </ng-container>

        <ng-container matColumnDef="goal">
          <th mat-header-cell *matHeaderCellDef>Goal</th>
          <td mat-cell *matCellDef="let t">{{ t.goal }}</td>
        </ng-container>

        <ng-container matColumnDef="dailyCalorieTarget">
          <th mat-header-cell *matHeaderCellDef>Daily Cal Target</th>
          <td mat-cell *matCellDef="let t">{{ t.dailyCalorieTarget }} kcal</td>
        </ng-container>

        <ng-container matColumnDef="durationWeeks">
          <th mat-header-cell *matHeaderCellDef>Duration</th>
          <td mat-cell *matCellDef="let t">{{ t.durationWeeks }} weeks</td>
        </ng-container>

        <ng-container matColumnDef="foodItemCount">
          <th mat-header-cell *matHeaderCellDef>Food Items</th>
          <td mat-cell *matCellDef="let t">{{ t.foodItemCount ?? 0 }} items</td>
        </ng-container>

        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Status</th>
          <td mat-cell *matCellDef="let t">
            <span [ngClass]="{
              'badge-active':   t.status === 'Active',
              'badge-inactive': t.status === 'Inactive'
            }">{{ t.status }}</span>
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th style="text-align:center" mat-header-cell *matHeaderCellDef>Actions</th>
          <td style="display:flex;justify-content:center" mat-cell *matCellDef="let t">
            <div class="action-column">
              <button mat-icon-button matTooltip="Assign Foods" (click)="assignFoods(t)">
                <img src="../../../../assets/images/icon/assign-light.png" style="height:18px;width:18px">
              </button>
              <button mat-icon-button class="gray-icon-btn" matTooltip="Edit" (click)="editData(t)">
                <img src="../../../../assets/images/icon/edit-light.png" style="height:18px;width:18px">
              </button>
              <button mat-icon-button class="gray-icon-btn" matTooltip="Delete" (click)="deleteData(t)">
                <img src="../../../../assets/images/icon/delete-light.png" style="height:18px;width:18px">
              </button>
            </div>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

        <tr *ngIf="dataSource?.data?.length === 0">
          <td [attr.colspan]="displayedColumns.length" class="no-data">No meal plan templates found</td>
        </tr>

      </table>
    </div>

    <mat-paginator [pageSizeOptions]="[5, 10, 25]" class="pagination"></mat-paginator>

  </div>
</div>
