<div class="container">
  <!-- Table Section to the Right of Form -->
  <div class="table-section">
    <!-- title of the-->
    <h2 class="form-title">Upload Meal Plan</h2>

    <div class="toolbar">
      <!-- add-new on the left -->
      <div class="add-new">

      </div>

      <!-- table filter-->
      <div class="table-filter">
        <mat-form-field appearance="outline">
          <mat-label>
            <mat-icon class="search-icon">search</mat-icon>
            Search...
          </mat-label>
          <input matInput (keyup)="applyFilter($event)" placeholder="" #input />
        </mat-form-field>

        <!-- refresh button-->
        <div>
          <button mat-icon-button (click)="refreshData()" class="refresh-button">
            <mat-icon>refresh</mat-icon>
          </button>
        </div>
      </div>
    </div>

    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

      <!-- employeeId Column -->
      <ng-container matColumnDef="member">
        <th mat-header-cell *matHeaderCellDef>Member</th>
        <td mat-cell *matCellDef="let element">{{ element.userId }}</td>
      </ng-container>

      <!-- dateOfJoining Column -->
      <!-- | date:'dd/MM/yyyy' -->
      <ng-container matColumnDef="requestedDate">
        <th mat-header-cell *matHeaderCellDef>Requested Date</th>
        <td mat-cell *matCellDef="let element">{{ element.requestedDate | date: 'dd/MM/yyyy' }}</td>
      </ng-container>

      <!-- firstName Column -->
      <ng-container matColumnDef="fitnessGoal">
        <th mat-header-cell *matHeaderCellDef>Fitness Goal</th>
        <td mat-cell *matCellDef="let element">{{ element.fitnessGoal }}</td>
      </ng-container>

      <!-- firstName Column -->
      <ng-container matColumnDef="allergies">
        <th mat-header-cell *matHeaderCellDef>Allergies</th>
        <td mat-cell *matCellDef="let element">{{ element.allergies || 'N/A' }}</td>
      </ng-container>

      <!-- firstName Column -->
      <ng-container matColumnDef="dietaryPreferences">
        <th mat-header-cell *matHeaderCellDef>Dietary Preferences</th>
        <td mat-cell *matCellDef="let element">{{ element.dietaryPreferences }}</td>
      </ng-container>

      <!-- firstName Column -->
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let element">{{ element.status }}</td>
      </ng-container>

      <!-- action Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef style="text-align: center;">Actions</th>
        <td mat-cell *matCellDef="let element">
          <div class="action-column" style="justify-content: center;">
            <!-- <button mat-icon-button class="gray-icon-btn" matTooltip="View" (click)="viewData(element)">
              <mat-icon>visibility</mat-icon>
            </button> -->
            <button mat-icon-button class="gray-icon-btn" matTooltip="Upload Plan" (click)="uploadPlan(element)">
              <mat-icon>upload</mat-icon>
            </button>

          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <!-- pagination-->
    <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of users" class="pagination"></mat-paginator>
  </div>
</div>
