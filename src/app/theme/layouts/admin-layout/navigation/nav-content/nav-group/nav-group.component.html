<li class="nav-item coded-menu-caption" style="color: #fff;">
  <label (click)="toggleGroup()" class="menu-label">
    <span class="menu-title">{{ item.title }}</span>
    <!-- <span class="menu-arrow">{{ isExpanded ? '▼' : '▶' }}</span> -->
    <img class="menu-arrow" src="../../../../assets/images/icon/{{isExpanded ? 'collapse-light.png' : 'expand-light.png'}}">
  </label>
</li>

<!-- @for (item of item.children; track item) {
  @if (item.type === 'collapse' && item.isVisible) {
    <app-nav-collapse [item]="item"></app-nav-collapse>
  } @else if (item.type === 'item') {
    <app-nav-item [item]="item"></app-nav-item>
  }
} -->
@if (isExpanded) {
  @for (item of item.children; track item) {
    @if (item.type === 'collapse' && item.isVisible) {
      <app-nav-collapse [item]="item"></app-nav-collapse>
    } @else if (item.type === 'item') {
      <app-nav-item [item]="item"></app-nav-item>
    }
  }
}
